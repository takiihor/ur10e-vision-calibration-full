[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anodizing-web"
version = "0.1.0"
description = "Interface PC web service and adapters for the anodizing test modules"
requires-python = ">=3.11"
# The four vendor packages are installed from their local paths; see README.md.
dependencies = [
    "numpy==2.3.5",
    "opencv-python==4.11.0.86",
    "Pillow==12.0.0",
    "reportlab==4.4.5",
    "pypdf==6.1.3",
    "packaging==25.0",
    "charset-normalizer==3.4.4",
    "scipy>=1.11,<2",
]

[project.optional-dependencies]
realsense = ["pyrealsense2==2.59.1.11053"]
basler = ["pypylon>=4,<5"]
robot = ["ur_rtde==1.6.5"]
serial = ["pyserial>=3.5"]
bluetooth = ["bleak==3.1.0"]
test = ["pytest==8.4.2"]

[project.scripts]
anodizing-modules = "anodizing_web.server:main"
anodizing-module-token = "anodizing_web.module_tokens:main"

[tool.setuptools]
packages = ["anodizing_web"]

[tool.setuptools.package-data]
anodizing_web = ["agv-ble-fields.json", "web/*.html", "web/*.css", "web/*.js", "web/*.mjs", "operator_dist/*.html", "operator_dist/*.json", "operator_dist/*.txt", "operator_dist/assets/*"]
