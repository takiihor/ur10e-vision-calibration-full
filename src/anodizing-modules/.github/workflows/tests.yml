name: tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install system test tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils libgl1 libglib2.0-0
      - name: Install app dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements-dev.txt
      - name: Run all Python suites
        env:
          ANODIZING_PYTHON: python
        run: ./tools/test-all.bash
